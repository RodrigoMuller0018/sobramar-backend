spring.application.name=sobramar-backend

# Só o Flyway altera o schema; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Erros no formato Problem Details (RFC 9457).
spring.mvc.problemdetails.enabled=true

# Toda listagem é paginada, com limite máximo.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Expõe só o health check.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Segurança. Os segredos vêm do ambiente e nunca entram no Git (ver .env.example).
sobramar.seguranca.jwt-segredo=${SOBRAMAR_JWT_SEGREDO}
sobramar.seguranca.chave-cifragem=${SOBRAMAR_CHAVE_CIFRAGEM}
sobramar.seguranca.cookie-seguro=${SOBRAMAR_COOKIE_SEGURO:true}

# Conta criada ao subir, se ainda não existir. Não há cadastro público na Entrega A.
sobramar.conta-inicial.email=${SOBRAMAR_CONTA_INICIAL_EMAIL:}
sobramar.conta-inicial.senha=${SOBRAMAR_CONTA_INICIAL_SENHA:}
